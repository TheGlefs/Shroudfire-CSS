name: Build Source plugin
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SourceMod compiler
        env:
          SOURCEMOD_URL: https://github.com/alliedmodders/sourcemod/releases/download/1.12.0.7255/sourcemod-1.12.0-git7255-linux.tar.gz
          SOURCEMOD_SHA256: 02be752ddc25d344a379800df9395a2847ab85b71acea9167fdca8163010d5b9
        run: |
          mkdir -p /tmp/sourcemod
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/sourcemod.tar.gz "$SOURCEMOD_URL"
          echo "$SOURCEMOD_SHA256  /tmp/sourcemod.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/sourcemod.tar.gz -C /tmp/sourcemod
          chmod +x /tmp/sourcemod/addons/sourcemod/scripting/spcomp64
      - name: Check repository contracts
        if: ${{ hashFiles('tests/test_*.py') != '' }}
        run: python -m unittest discover -s tests -v
      - name: Regenerate references and verify no drift
        run: |
          python tools/generate_guides.py
          python tools/generate_reference.py
          git diff --exit-code
      - name: Compile and package
        run: python tools/build.py --compiler /tmp/sourcemod/addons/sourcemod/scripting/spcomp64 --fastdl
      - uses: actions/upload-artifact@v4
        with:
          name: shroudfire-css
          path: |
            dist/shroudfire-css-*.zip
            dist/SHA256.json
            dist/fastdl/
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux x86 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-multilib binutils
      - name: Compile Connect query-cache addon
        run: bash tools/build_connect.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shroudfire-connect-linux-x86
          path: |
            dist/shroudfire-connect-linux-x86.zip
            dist/connect/package/
