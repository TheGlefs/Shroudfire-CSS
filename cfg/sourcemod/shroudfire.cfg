// Shroudfire gameplay configuration. Generated from settings.inc.
// Enable custom voices only after client downloads work.

// Role level required for normal upgrade stage 1.
sf_normal_stage1_level "1"

// Role level required for normal upgrade stage 2.
sf_normal_stage2_level "5"

// Role level required for normal upgrade stage 3.
sf_normal_stage3_level "10"

// Role level required for normal upgrade stage 4.
sf_normal_stage4_level "15"

// Role level required for normal upgrade stage 5.
sf_normal_stage5_level "20"

// Role level required for ultimate upgrade stage 1.
sf_ultimate_stage1_level "8"

// Role level required for ultimate upgrade stage 2.
sf_ultimate_stage2_level "16"

// Role level required for ultimate upgrade stage 3.
sf_ultimate_stage3_level "24"

// Role level required for ultimate upgrade stage 4.
sf_ultimate_stage4_level "32"

// Role level required for ultimate upgrade stage 5.
sf_ultimate_stage5_level "40"

// Invisant armor before Resilience.
sf_invisant_base_armor "25"

// Minimum Invisant knife damage per hit, inclusive.
sf_knife_damage_min "50"

// Maximum Invisant knife damage per hit, inclusive.
sf_knife_damage_max "75"

// Comma-separated weapons Armitive cannot buy; empty allows all weapons.
sf_armitive_blocked_weapons "m249"

// Seconds of live play after freeze time before Invisant starvation can begin.
sf_starvation_round_delay "60.0"

// Seconds without dealing or taking damage before Invisant starvation begins.
sf_starvation_combat_delay "45.0"

// Health an Invisant loses per starvation tick before acceleration.
sf_starvation_damage "1"

// Seconds between Invisant starvation ticks before acceleration.
sf_starvation_interval "1.0"

// Seconds of uninterrupted starvation before accelerated ticks begin; 0 accelerates immediately.
sf_starvation_acceleration_delay "20.0"

// Seconds between Invisant starvation ticks after acceleration.
sf_starvation_accelerated_interval "1.0"

// Health an Invisant loses per starvation tick after acceleration.
sf_starvation_accelerated_damage "3"

// Maximum Invisant knife reach in units; 0 disables extended hits.
sf_knife_range "72.0"

// Full Invisant knife cone width in degrees; 360 covers every direction.
sf_knife_cone "60.0"

// Invisant knife attack speed as a percent of normal; 100 restores the normal rate.
sf_knife_attack_speed_percent "66"

// Replay Invisant knife air-miss sounds spatially to Armitive players.
sf_knife_miss_sound "1"

// Replay Invisant knife wall and ground impact sounds spatially to Armitive players.
sf_knife_world_hit_sound "1"

// Gravity reduction percent per Lightweight stage.
sf_lightweight_gravity_percent "10"

// Run speed increase percent per Momentum stage.
sf_momentum_run_percent "3"

// Maximum armor gained per Resilience stage.
sf_resilience_armor_per_stage "15"

// Resilience stage that grants a helmet.
sf_resilience_helmet_stage "5"

// Armor regenerated per Reforging stage each interval.
sf_reforging_armor_per_stage "1"

// Seconds between Reforging armor ticks and after damage.
sf_reforging_interval "3"

// Health restored per Vampirism stage on a damaging hit.
sf_vampirism_health_per_stage "3"

// Health restored per Bloodlust stage on a kill.
sf_bloodlust_health_per_stage "6"

// Crouch speed increase percent per Mobility stage.
sf_mobility_crouch_percent "15"

// Surge speed boost at stage 1. Default: 480.
sf_surge_base_speed "480"

// Additional Surge speed boost for each stage after stage 1. Default: 30.
sf_surge_speed_per_stage "30"

// Whether Surge adds to current velocity (1) or replaces it (0). Default: 0.
sf_surge_add_momentum "0"

// Seconds until Surge is ready after use.
sf_surge_cooldown "20"

// Armitive health before Fortitude.
sf_armitive_base_health "100"

// Maximum health gained per Fortitude stage.
sf_fortitude_health_per_stage "10"

// Health regenerated per Recovery stage each interval.
sf_recovery_health_per_stage "1"

// Seconds between Recovery health ticks and after damage.
sf_recovery_interval "3"

// Magazine capacity increase percent per Overload stage.
sf_overload_magazine_percent "10"

// Extra reserve clips per Stockpile stage.
sf_stockpile_clips_per_stage "1"

// Weapon fire rate increase percent per Barrage stage.
sf_barrage_fire_rate_percent "7"

// Recoil and spread reduction percent per Control stage.
sf_control_reduction_percent "10"

// Reload and weapon switch time reduction percent per Dexterity stage.
sf_dexterity_speed_percent "12"

// Ward immunity duration at stage 1 in seconds.
sf_ward_base_seconds "2.0"

// Additional Ward seconds for each stage after stage 1.
sf_ward_seconds_per_stage "0.5"

// Seconds until Ward is ready after it ends.
sf_ward_cooldown "30"

// Seconds from round start when purchased or reset upgrades apply immediately.
sf_upgrade_purchase_window "20"

// Enables Shroudfire.
sf_enable "1"

// Selects the Invisant team: 2 for Terrorists or 3 for Counter-Terrorists.
sf_invisant_team "3"

// Maximum number of Armitive players per Invisant player.
sf_visible_per_invisant "4"

// Seconds before an unfinished round ends with an Armitive win.
sf_round_time "120"

// Completed rounds per map before changing maps; 0 disables the round limit.
sf_map_max_rounds "20"

// Minutes per map with at least two active human players before changing maps; 0 disables the time limit.
sf_map_time_limit "30.0"

// Comma-separated map rotation; unavailable maps are skipped.
sf_map_rotation "de_dust2,de_mirage,de_inferno,de_nuke"

// Kill surviving Invisant at timeout; 0 reveals them during the 10-second round transition instead.
sf_timeout_kill_invisant "0"

// Seconds for surviving Invisant to fade from invisible to visible after timeout; 0 reveals instantly.
sf_timeout_reveal_seconds "2.0"

// Seconds after map start in which joining players can respawn as Armitive.
sf_map_join_grace "30"

// Seconds of inactivity after freeze time before a player is killed; 0 disables AFK deaths.
sf_afk_seconds "30"

// Seconds before AFK death to start the HUD countdown and warning sounds; 0 disables the warnings.
sf_afk_warning_seconds "10"

// Consecutive deaths without live-round movement before a player is kicked; 0 disables kicks.
sf_afk_limit "5"

// Distance in units an Armitive must move from the tracked position before the camping timer resets; 0 disables anti-camping.
sf_camping_distance "256.0"

// Seconds an Armitive may remain within the camping distance before the HUD and voice warning.
sf_camping_warning_seconds "20.0"

// Seconds from the Armitive camping warning until health loss begins.
sf_camping_damage_delay "10.0"

// Health an Armitive loses per second while camping.
sf_camping_damage "10"

// Seconds a reconnecting player retains queue age; 0 is unlimited.
sf_queue_reconnect_grace "600"

// XP for an Invisant killing an Armitive player.
sf_xp_kill_invisant "50"

// XP for an Armitive player killing an Invisant.
sf_xp_kill_armitive "100"

// XP for an Invisant participant on a completed win.
sf_xp_round_win_invisant "70"

// XP for an Armitive participant on a completed win.
sf_xp_round_win_armitive "35"

// Armitive pistol kill XP as a percent of Armitive base kill XP; 100 removes the bonus.
sf_xp_armitive_pistol_percent "125"

// Armitive knife kill XP as a percent of Armitive base kill XP; 100 removes the bonus.
sf_xp_armitive_knife_percent "150"

// Base XP for the level curve.
sf_xp_level_base "100"

// Maximum seconds between a player's consecutive opponent kills for a kill streak.
sf_kill_streak_window "10.0"

// Fraction of the current role's kill XP awarded for a qualifying assist. Set to 0 to disable assist XP.
sf_xp_assist_fraction "0.25"

// Minimum share of a victim's opposing-player damage required for assist XP. 0.25 means 25 percent.
sf_xp_assist_damage_share "0.25"

// Kill XP percent for First Blood; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_first_blood_percent "125"

// Kill XP percent for Double Kill; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_double_kill_percent "120"

// Kill XP percent for Killing Spree; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_killing_spree_percent "130"

// Kill XP percent for Ultra Kill; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_ultra_kill_percent "140"

// Kill XP percent for Rampage; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_rampage_percent "150"

// Kill XP percent for Dominating; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_dominating_percent "160"

// Kill XP percent for Unstoppable; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_unstoppable_percent "170"

// Kill XP percent for Monster Kill; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_monster_kill_percent "180"

// Kill XP percent for Godlike; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_godlike_percent "190"

// Kill XP percent for Holy Shit; multiplies the Armitive knife or pistol bonus when applicable.
sf_xp_holy_shit_percent "200"

// Allow Invisant players to see and spectate Invisant teammates.
sf_invisant_see_teammates "1"

// Discord server invite link in chat messages; empty disables the messages.
sf_discord_link "https://discord.gg/TMV2DEPhqT"

// Enables Discord invite messages in chat.
sf_discord_message "1"

// Seconds between recurring Discord invite messages.
sf_discord_interval "1200"

// Enables the automatic audio chat hint.
sf_audio_hint "1"

// Seconds before the automatic audio chat hint can trigger again.
sf_audio_hint_cooldown "60"

// Enables the automatic cheat chat hint.
sf_cheat_hint "1"

// Seconds before the automatic cheat chat hint can trigger again.
sf_cheat_hint_cooldown "60"

// Enables the automatic upgrade chat hint.
sf_upgrade_hint "1"

// Seconds before the automatic upgrade chat hint can trigger again.
sf_upgrade_hint_cooldown "60"

// Enables the automatic known-bugs chat hint.
sf_bugs_hint "1"

// Seconds before the automatic known-bugs chat hint can trigger again.
sf_bugs_hint_cooldown "60"

// Enables the automatic upgrade-menu chat hint.
sf_menu_hint "1"

// Seconds before the automatic upgrade-menu chat hint can trigger again.
sf_menu_hint_cooldown "60"

// Enables the automatic upgrade-reset chat hint.
sf_reset_hint "1"

// Seconds before the automatic upgrade-reset chat hint can trigger again.
sf_reset_hint_cooldown "60"

// Enables the automatic rank chat hint.
sf_rank_hint "1"

// Seconds before the automatic rank chat hint can trigger again.
sf_rank_hint_cooldown "60"

// Show role, level, XP and queue position in the round-start center panel.
sf_hud "1"

// Seconds to show the round-start role, level, XP and queue panel. Set to 0 to disable.
sf_round_info_seconds "10"

// Seconds to show each kill XP line, including post-round kills; 0 hides these lines.
sf_hud_kill_seconds "5.0"

// Seconds to show each assist XP line; 0 hides these lines without changing XP awards.
sf_hud_assist_seconds "5.0"

// Seconds to show the round win or draw title; 0 hides the title.
sf_hud_round_result_seconds "10.0"

// Seconds to show round-win XP; 0 hides this line without changing XP awards.
sf_hud_round_win_xp_seconds "10.0"

// Seconds to show a level-up line; 0 hides these lines.
sf_hud_levelup_seconds "5.0"

// Seconds to show earned Invisant queue priority; 0 hides this line without changing priority.
sf_hud_priority_seconds "5.0"

// Seconds to show No rewards after round end following a post-round kill; 0 hides this line.
sf_hud_no_rewards_seconds "5.0"

// Seconds before timeout when the Invisant fade warning and reveal voice begin; 0 disables both.
sf_timeout_warning_seconds "10"

// Show living Armitive with through-wall outlines to living Invisant players.
sf_wallhack "1"

// Green screen tint strength while Ward is active. Set to 0 to disable; 255 is maximum.
sf_ward_screen_tint "85"

// Create validated additional team spawns on Windows and Linux when the map does not have enough for the maximum roster.
sf_extra_spawns "1"

// Number of additional blood-splatter bursts when an Armitive damages an Invisant or an Invisant knife damages an Armitive. Set to 0 for normal blood only.
sf_blood_amount "4"

// Attempts to set HDR exposure on the map's tonemap controller. Stock de_dust2 lighting is baked and unaffected.
sf_tonemap_exposure "0.40"

// Allow administrators with the generic flag to observe players or use a spectator free camera.
sf_admin_spectate "1"

// Play Shroudfire voice clips when clients have downloaded the supplied sounds.
sf_custom_sounds "0"

// Block an Invisant's own footsteps, jumps, and landings using Source client prediction overrides.
sf_silent_local_movement "1"

// Delay in seconds before playing an Armitive win, Invisant win, or round draw voice clip.
sf_round_win_sound_delay "0.5"

// Show a chat notice when an Armitive player earns Invisant priority.
sf_announce "1"

// Baked map-light brightness: a is darkest, h is dark, m is normal.
sf_map_lightstyle "h"

// Red color-grade strength for Invisant players; 0 disables it.
sf_invisant_screen_tint "125"
